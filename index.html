<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حلبة الأرقام - تصغير تلقائي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0a0a0f;
      color: #f0f0f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .calculator {
      background: #111118;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 20px 16px 16px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .display {
      background: #080810;
      border-radius: 14px;
      border: 1px solid #2a2a3a;
      padding: 16px 18px;
      /* 🔥 ارتفاع ثابت - لن يتغير أبداً */
      height: 100px;
      min-height: 100px;
      max-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      margin-bottom: 16px;
      transition: none;
    }
    .display-expr {
      font-size: 0.8rem;
      color: #6b6b8a;
      min-height: 20px;
      word-break: break-all;
      text-align: left;
      direction: ltr;
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .display-value {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: #f0f0f8;
      letter-spacing: 1px;
      direction: ltr;
      text-align: left;
      width: 100%;
      line-height: 1.2;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      /* الحجم الأساسي يبدأ كبيراً ويتصغر تدريجياً */
      font-size: 2.2rem;
      transition: font-size 0.1s ease;
    }
    .display-value.pos { color: #22c55e; }
    .display-value.neg { color: #ef4444; }
    .display-value.zero { color: #6b6b8a; }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    .btn {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      color: #f0f0f8;
      font-family: 'Cairo', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      height: 60px;
      cursor: pointer;
      transition: all 0.08s linear;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.94); }
    .btn.op {
      background: rgba(240, 192, 64, 0.08);
      color: #f0c040;
      border-color: rgba(240, 192, 64, 0.2);
      font-size: 1.4rem;
    }
    .btn.clear {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.25);
    }
    .btn.backspace {
      background: rgba(239, 68, 68, 0.06);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.15);
      font-size: 1rem;
    }
    .btn.equals {
      background: linear-gradient(135deg, #f0c040, #e07820);
      color: #0a0a0f;
      border: none;
      font-size: 1.6rem;
      font-weight: 900;
      grid-column: span 2;
    }
    .btn.zero { grid-column: span 2; }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #6b6b8a;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .user-badge strong { color: #f0c040; font-weight: 700; }

    .history-section {
      border-top: 1px solid #2a2a3a;
      padding: 12px 4px 4px;
      margin-top: 12px;
      max-height: 140px;
      overflow-y: auto;
    }
    .history-section::-webkit-scrollbar { width: 4px; }
    .history-section::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      border-radius: 8px;
      margin-bottom: 4px;
      background: #12121c;
      border: 1px solid #1f1f2e;
      font-size: 0.75rem;
    }
    .history-item-name {
      font-weight: 600;
      margin-left: 6px;
    }
    .history-item-expr {
      color: #6b6b8a;
      direction: ltr;
      text-align: left;
      font-size: 0.7rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 120px;
    }
    .history-item-result {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      direction: ltr;
      font-size: 0.8rem;
    }
    .history-empty {
      text-align: center;
      padding: 12px;
      color: #6b6b8a;
      font-size: 0.75rem;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #111118;
      border: 1px solid #2a2a3a;
      border-radius: 100px;
      padding: 4px 14px;
      font-size: 0.7rem;
      color: #6b6b8a;
      margin-bottom: 16px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #6b6b8a;
      transition: 0.3s;
    }
    .dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e55; }
    .dot.error { background: #ef4444; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 100px;
      padding: 8px 22px;
      font-size: 0.8rem;
      z-index: 200;
      transition: transform 0.3s cubic-bezier(.16,1,.3,1);
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .login-box {
      background: #111118;
      border: 1px solid #2a2a3a;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .login-box h2 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #f0c040, #e07820);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .login-box p { color: #6b6b8a; font-size: 0.85rem; margin-bottom: 20px; }
    .login-input {
      width: 100%;
      background: #1a1a24;
      border: 1.5px solid #2a2a3a;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      color: #f0f0f8;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
    }
    .login-input:focus { border-color: #f0c040; }
    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #f0c040, #e07820);
      color: #0a0a0f;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-btn:active { transform: scale(0.96); }
    .login-err { color: #ef4444; font-size: 0.8rem; min-height: 20px; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="loginModal">
  <div class="login-box">
    <div class="login-icon">🧮</div>
    <h2>حلبة الأرقام</h2>
    <p>تنافس مع زملائك — الأرقام تتوسع وتتصغر تلقائياً</p>
    <input id="nameInput" class="login-input" type="text" placeholder="اسمك..." maxlength="20">
    <button class="login-btn" id="joinBtn">ادخل الحلبة ⚡</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="calculator" id="mainApp">
  <div class="status-pill">
    <div class="dot" id="connDot"></div>
    <span id="connLabel">غير متصل</span>
  </div>
  <div class="user-badge">👤 <strong id="dispUser">—</strong></div>

  <!-- 🔥 المستطيل له ارتفاع ثابت (100px) ولن يتغير أبداً -->
  <div class="display" id="displayArea">
    <div class="display-expr" id="exprEl"></div>
    <div class="display-value" id="valEl">0</div>
  </div>

  <div class="buttons" id="btnGrid">
    <button class="btn clear" data-action="clear">C</button>
    <button class="btn backspace" data-action="back">⌫</button>
    <button class="btn op" data-op="÷">÷</button>
    <button class="btn op" data-op="×">×</button>

    <button class="btn" data-num="9">9</button>
    <button class="btn" data-num="8">8</button>
    <button class="btn" data-num="7">7</button>
    <button class="btn op" data-op="−" style="grid-row:2/4;grid-column:4;height:auto;">−</button>

    <button class="btn" data-num="6">6</button>
    <button class="btn" data-num="5">5</button>
    <button class="btn" data-num="4">4</button>

    <button class="btn" data-num="3">3</button>
    <button class="btn" data-num="2">2</button>
    <button class="btn" data-num="1">1</button>
    <button class="btn op" data-op="+" style="grid-row:4/6;grid-column:4;height:auto;">+</button>

    <button class="btn equals" data-action="calc" style="grid-column:1/2;">=</button>
    <button class="btn zero" data-num="0" style="grid-column:2/4;">0</button>
  </div>

  <div class="history-section" id="historySection">
    <div style="font-size:0.7rem;color:#6b6b8a;margin-bottom:6px;">📋 آخر العمليات</div>
    <div id="historyList"><div class="history-empty">لا توجد عمليات بعد…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── حالتنا الأساسية ────────────────────────────────────────────
let myName = '';
let expr = '';
let myId = localStorage.getItem('arenaId') || 'u_' + Math.random().toString(36).slice(2,10);
localStorage.setItem('arenaId', myId);

const players = {};
const history = [];
const knownExprs = new Set();

// ─── DOM ─────────────────────────────────────────────────────────
const loginModal = document.getElementById('loginModal');
const mainApp = document.getElementById('mainApp');
const nameInput = document.getElementById('nameInput');
const joinBtn = document.getElementById('joinBtn');
const loginErr = document.getElementById('loginErr');
const connDot = document.getElementById('connDot');
const connLabel = document.getElementById('connLabel');
const dispUser = document.getElementById('dispUser');
const exprEl = document.getElementById('exprEl');
const valEl = document.getElementById('valEl');
const historyList = document.getElementById('historyList');
const toastEl = document.getElementById('toast');

// ─── تخزين الحالة المحلية ──────────────────────────────────────
let mySavedValue = null;
let mySavedExpr = null;

function loadMySavedValue() {
  try {
    const saved = JSON.parse(localStorage.getItem('arenaMyValue'));
    if (saved && saved.expiresAt && Date.now() < saved.expiresAt) {
      mySavedValue = saved.value;
      mySavedExpr = saved.expr;
      return true;
    }
  } catch(e) {}
  return false;
}
function saveMyValue(value, expr) {
  const data = { value, expr, expiresAt: Date.now() + 3600000 };
  localStorage.setItem('arenaMyValue', JSON.stringify(data));
  mySavedValue = value;
  mySavedExpr = expr;
}
loadMySavedValue();

// ─── 🔥 دالة تصحيح حجم الخط تلقائياً (هذا هو الحل الأساسي) ──
function autoResizeDisplay(valueStr) {
  if (!valEl) return;
  // نحسب عدد الخانات الرقمية (نتجاهل الفواصل والعلامات)
  const clean = String(valueStr).replace(/[,\-\.]/g, '');
  const len = clean.length;
  
  let fontSize = 2.2; // rem (حجم البداية)
  if (len >= 20) fontSize = 0.9;
  else if (len >= 17) fontSize = 1.0;
  else if (len >= 14) fontSize = 1.2;
  else if (len >= 12) fontSize = 1.4;
  else if (len >= 10) fontSize = 1.6;
  else if (len >= 8) fontSize = 1.8;
  else if (len >= 6) fontSize = 2.0;
  else fontSize = 2.2;
  
  // نضمن عدم النزول تحت 0.8rem
  fontSize = Math.max(0.8, fontSize);
  valEl.style.fontSize = fontSize + 'rem';
}

// ─── عرض النتيجة مع فواصل وتصغير تلقائي ──────────────────────
function setDisplayValue(rawValue, colored = true) {
  const str = String(rawValue);
  const formatted = formatWithCommas(str);
  valEl.textContent = formatted;
  valEl.className = 'display-value';
  if (colored) {
    const num = parseFloat(str);
    if (!isNaN(num)) {
      if (num > 0) valEl.classList.add('pos');
      else if (num < 0) valEl.classList.add('neg');
      else valEl.classList.add('zero');
    }
  }
  // 🔥 تطبيق التصغير التلقائي بناءً على طول النص
  autoResizeDisplay(formatted);
}

// ─── تنسيق الفواصل ─────────────────────────────────────────────
function formatWithCommas(numStr) {
  if (!numStr) return '0';
  let isNeg = false;
  let s = String(numStr);
  if (s.startsWith('-')) { isNeg = true; s = s.substring(1); }
  let parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (isNeg ? '-' : '') + parts.join('.');
}

// ─── تنسيق المعادلة الظاهرة ──────────────────────────────────
function formatExpressionPreview(input) {
  if (!input) return '';
  let parts = input.split(/([+\-*/÷×=])/);
  let result = '';
  for (let p of parts) {
    if (p && !/[+\-*/÷×=]/.test(p)) {
      let trimmed = p.trim();
      let formatted = formatWithCommas(trimmed);
      result += p.replace(trimmed, formatted);
    } else {
      result += p;
    }
  }
  return result;
}

// ─── تحديث الشاشة (expr + value) ─────────────────────────────
function refreshDisplay() {
  exprEl.textContent = formatExpressionPreview(expr);
  if (expr.trim() === '') {
    setDisplayValue('0', false);
  } else {
    let raw = expr.replace(/[,\s]/g, '');
    if (!isNaN(raw) && raw !== '') {
      setDisplayValue(raw, true);
    } else {
      valEl.textContent = formatExpressionPreview(expr);
      valEl.className = 'display-value';
      autoResizeDisplay(valEl.textContent);
    }
  }
}

// ─── الحساب ────────────────────────────────────────────────────
function calculate() {
  if (!expr.trim()) return;
  try {
    const safe = expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-')
                     .replace(/[^0-9+\-*/.()%\s]/g,'');
    const result = Function('"use strict";return('+safe+')')();
    if (!isFinite(result)) throw 0;
    const formatted = +result.toFixed(10);
    const lastExpr = expr + ' =';
    expr = String(formatted);

    exprEl.textContent = formatExpressionPreview(lastExpr);
    setDisplayValue(formatted, true);

    saveMyValue(formatted, lastExpr);

    const key = myId + '|' + lastExpr + '|' + formatted;
    if (!knownExprs.has(key)) {
      knownExprs.add(key);
      history.unshift({ name: myName, expr: lastExpr, result: formatted });
      if (history.length > 10) history.length = 10;
      saveHistory();
      renderHistory();
    }

    if (myName) {
      players[myId] = { name: myName, value: formatted, expr: lastExpr };
      renderLB();
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type:'calc', value: formatted, expr: lastExpr }));
      }
    }
  } catch {
    setDisplayValue('خطأ', false);
    expr = '';
    setTimeout(() => { setDisplayValue('0', false); }, 1000);
  }
}

// ─── تاريخ محلي ────────────────────────────────────────────────
function saveHistory() {
  try { localStorage.setItem('arenaHistory', JSON.stringify(history)); } catch(e) {}
}
function loadSavedHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem('arenaHistory'));
    if (saved && Array.isArray(saved)) {
      saved.forEach(h => {
        history.push(h);
        knownExprs.add(h.name + '|' + h.expr + '|' + h.result);
      });
      if (history.length > 10) history.length = 10;
    }
  } catch(e) {}
}
loadSavedHistory();

function renderHistory() {
  if (!history.length) {
    historyList.innerHTML = '<div class="history-empty">لا توجد عمليات بعد…</div>';
    return;
  }
  historyList.innerHTML = '';
  history.slice(0,10).forEach(h => {
    const cls = h.result > 0 ? 'pos' : (h.result < 0 ? 'neg' : '');
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;min-width:0;flex:1;">
        <span class="history-item-name">${esc(h.name)}</span>
        <span class="history-item-expr" dir="ltr">${formatExpressionPreview(esc(h.expr))}</span>
      </div>
      <span class="history-item-result ${cls}" dir="ltr">${formatWithCommas(h.result)}</span>
    `;
    historyList.appendChild(div);
  });
}

// ─── لوحة المتصدرين ────────────────────────────────────────────
function renderLB() {
  const entries = Object.entries(players).sort((a,b)=> (b[1].value??0) - (a[1].value??0));
}

// ─── WebSocket (محاكاة) ──────────────────────────────────────
let ws = null;
function connectWS() {
  setConn(true);
  loginModal.classList.add('hidden');
  mainApp.classList.remove('hidden');
  dispUser.textContent = myName;
  if (mySavedValue !== null && mySavedValue !== 0) {
    expr = String(mySavedValue);
    exprEl.textContent = mySavedExpr || '';
    setDisplayValue(mySavedValue, true);
  } else {
    setDisplayValue('0', false);
  }
  renderHistory();
  players[myId] = { name: myName, value: mySavedValue || 0, expr: mySavedExpr || '' };
  renderLB();
}

function setConn(on) {
  connDot.className = 'dot' + (on ? ' online' : ' error');
  connLabel.textContent = on ? 'متصل' : 'محلي';
}

// ─── الدخول ────────────────────────────────────────────────────
joinBtn.addEventListener('click', doJoin);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); });

function doJoin() {
  const name = nameInput.value.trim();
  if (!name) { loginErr.textContent = 'أدخل اسمك أولاً!'; return; }
  myName = name;
  localStorage.setItem('arenaName', name);
  loginErr.textContent = '';
  connectWS();
}

// ─── أحداث الأزرار ─────────────────────────────────────────────
document.getElementById('btnGrid').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.num !== undefined) {
    if (expr === '0' && btn.dataset.num !== '.') expr = btn.dataset.num;
    else expr += btn.dataset.num;
    refreshDisplay();
    return;
  }
  if (btn.dataset.op !== undefined) {
    expr += btn.dataset.op;
    refreshDisplay();
    return;
  }
  switch(btn.dataset.action) {
    case 'clear': expr = ''; setDisplayValue('0', false); exprEl.textContent = ''; break;
    case 'back': expr = expr.slice(0,-1); refreshDisplay(); break;
    case 'calc': calculate(); break;
  }
});

// ─── لوحة المفاتيح ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!loginModal.classList.contains('hidden')) return;
  if ('0123456789'.includes(e.key)) {
    if (expr === '0') expr = e.key;
    else expr += e.key;
    refreshDisplay();
  } else if (e.key === '+') { expr += '+'; refreshDisplay(); }
  else if (e.key === '-') { expr += '−'; refreshDisplay(); }
  else if (e.key === '*') { expr += '×'; refreshDisplay(); }
  else if (e.key === '/') { e.preventDefault(); expr += '÷'; refreshDisplay(); }
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Backspace') { expr = expr.slice(0,-1); refreshDisplay(); }
  else if (e.key === 'Escape') { expr = ''; setDisplayValue('0', false); exprEl.textContent = ''; }
});

// ─── أدوات مساعدة ──────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── Toast ──────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

// ─── تهيئة أولية ──────────────────────────────────────────────
const savedName = localStorage.getItem('arenaName');
if (savedName) nameInput.value = savedName;
renderHistory();
console.log('✅ حلبة الأرقام جاهزة - المستطيل ثابت والأرقام تتصغر تلقائياً');
</script>
</body>
</html>
